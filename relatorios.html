<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Supermercado Marcão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/relatorios.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div class="relatorio-layout">
        <header class="header-operacao">
            <a href="index.html" class="btn-voltar" title="Voltar para o Menu Principal">
                <span class="tecla-esc">ESC</span> Voltar
            </a>
            <div class="header-titulo">
                <h2><i class="fa-solid fa-chart-pie"></i> RELATÓRIOS E FECHAMENTO DE CAIXA</h2>
            </div>
            <div class="operador"><i class="fa-solid fa-user-tie"></i> OP: Gerência</div>
        </header>

        <main class="painel-central">
            
            <div class="filtros-container">
                <div class="filtro-grupo">
                    <label><i class="fa-regular fa-calendar"></i> Data Inicial</label>
                    <input type="date" id="filtro-data-ini">
                </div>
                <div class="filtro-grupo">
                    <label><i class="fa-regular fa-calendar"></i> Data Final</label>
                    <input type="date" id="filtro-data-fim">
                </div>
                <button onclick="filtrarVendas()" class="btn-filtrar"><i class="fa-solid fa-filter"></i> Filtrar</button>
            </div>

            <div class="resumo-cards">
                <div class="display-box">
                    <span class="label">Vendas Brutas</span>
                    <span class="valor" id="resumo-vendas">R$ 0,00</span>
                </div>
                <div class="display-box">
                    <span class="label">Contas Recebidas</span>
                    <span class="valor" id="resumo-contas" style="color: #f59e0b;">R$ 0,00</span>
                </div>
                <div class="display-box destaque-total">
                    <span class="label">Total Geral</span>
                    <span class="valor" id="resumo-total">R$ 0,00</span>
                </div>
            </div>

            <div class="grafico-container">
                <canvas id="graficoVendas"></canvas>
            </div>

            <!-- Container exclusivo para a Grade de Cards (Sem nenhuma tag <table>) -->
            <div class="table-container">
                <div id="tabela-relatorios" class="cards-grid">
                    <!-- Os cards das vendas serão renderizados aqui dinamicamente pelo JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/relatorios.js"></script>
</body>
